<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 — Grand Elevation Solar</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<script>
(function() {
  const stored = localStorage.getItem('theme');
  const theme = stored || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0A0A;
    --bg: #FAF8F3;
    --gold: #F2A623;
    --gold-light: #FBDFA8;
    --gold-deep: #E8651C;
    --gray-mid: #6B6B6B;
    --border: rgba(10,10,10,0.1);
  }

  html[data-theme="dark"] {
    --ink: #F4F1EA;
    --bg: #14130F;
    --gold: #F2A623;
    --gold-light: #4A3A1A;
    --gold-deep: #FFB648;
    --gray-mid: #9B968A;
    --border: rgba(244,241,234,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .wrap {
    text-align: center;
    max-width: 520px;
    width: 100%;
  }

  .mascot {
    width: 200px;
    height: auto;
    margin: 0 auto 32px;
    display: block;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .code {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 80px;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 12px;
    color: var(--gold-deep);
  }

  h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--gray-mid);
    margin-bottom: 32px;
  }

  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--bg);
  }

  .btn-primary:hover {
    background: var(--gold-deep);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--ink);
  }

  @media (max-width: 480px) {
    .code { font-size: 64px; }
    .mascot { width: 160px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <svg class="mascot" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- Solar panel body -->
    <rect x="40" y="65" width="120" height="90" rx="14" fill="var(--gold-light)" stroke="var(--ink)" stroke-width="2.5"/>
    
    <!-- Panel grid lines -->
    <line x1="40" y1="95" x2="160" y2="95" stroke="var(--ink)" stroke-width="1.5" opacity="0.25"/>
    <line x1="40" y1="125" x2="160" y2="125" stroke="var(--ink)" stroke-width="1.5" opacity="0.25"/>
    <line x1="80" y1="65" x2="80" y2="155" stroke="var(--ink)" stroke-width="1.5" opacity="0.25"/>
    <line x1="120" y1="65" x2="120" y2="155" stroke="var(--ink)" stroke-width="1.5" opacity="0.25"/>
    
    <!-- X eyes (knocked out) -->
    <line x1="72" y1="88" x2="84" y2="100" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="84" y1="88" x2="72" y2="100" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    
    <line x1="116" y1="88" x2="128" y2="100" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="128" y1="88" x2="116" y2="100" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Flat/unconscious mouth -->
    <line x1="92" y1="118" x2="108" y2="118" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Smoke puffs -->
    <circle cx="70" cy="48" r="10" fill="var(--gray-mid)" opacity="0.2"/>
    <circle cx="90" cy="38" r="13" fill="var(--gray-mid)" opacity="0.15"/>
    <circle cx="115" cy="44" r="9" fill="var(--gray-mid)" opacity="0.2"/>
    
    <!-- Spark / short circuit -->
    <path d="M145 140 L150 132 L155 140 L150 148 Z" fill="var(--gold-deep)" opacity="0.9"/>
    <line x1="142" y1="136" x2="138" y2="130" stroke="var(--gold-deep)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="158" y1="136" x2="162" y2="130" stroke="var(--gold-deep)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="150" y1="128" x2="150" y2="122" stroke="var(--gold-deep)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <div class="code">500</div>
  <h1>Something went wrong</h1>
  <p>This one's on us. Our servers hit a snag while processing your request. Try refreshing the page, or come back in a moment.</p>

  <div class="btn-row">
    <button type="button" class="btn btn-primary" onclick="location.reload()">Refresh page</button>
    <a href="/" class="btn btn-secondary">Back home</a>
  </div>
</div>

</body>
</html>
