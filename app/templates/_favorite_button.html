{% if username %}
<button
  type="button"
  class="favorite-btn {% if is_favorited %}is-favorited{% endif %}"
  aria-label="Toggle favorite"
  aria-pressed="{% if is_favorited %}true{% else %}false{% endif %}"
  hx-post="/favorites/{{ product_id }}"
  hx-target="this"
  hx-swap="outerHTML"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
</button>
{% else %}
<button
  type="button"
  class="favorite-btn"
  aria-label="Sign in to favorite"
  aria-pressed="false"
  data-requires-auth
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
</button>
{% endif %}
