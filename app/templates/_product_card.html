<a href="/products/{{ product.id }}" class="product-card">
    <div class="product-card-image">
        {% set first_img = product.image_url[0] if product.image_url is sequence and product.image_url is not string else product.image_url %}
        {% if first_img %}
        <img src="{{ first_img }}" alt="{{ product.name }}">
        {% else %}
        <div class="product-card-image-placeholder">No image</div>
        {% endif %}
    </div>
  <div class="product-card-info">
    <span class="category-tag">{{ product.category.replace('_', ' ') }}</span>
    <h3 class="product-card-name">{{ product.name }}</h3>
    <p class="product-card-price">₦{{ "{:,.2f}".format(product.price) }}</p>
  </div>
</a>
