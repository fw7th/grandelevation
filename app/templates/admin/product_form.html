<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ "Edit" if product else "Add" }} product — Admin</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<style>
  :root {
    --ink: #0A0A0A; --bg: #FAF8F3; --gold: #F2A623;
    --gold-light: #FBDFA8; --gold-deep: #E8651C;
    --gray-mid: #6B6B6B; --border: rgba(10,10,10,0.1); --error: #B3261E;
  }
  html[data-theme="dark"] {
    --ink: #F4F1EA; --bg: #14130F; --gold-light: #4A3A1A;
    --gold-deep: #FFB648; --gray-mid: #9B968A; --border: rgba(244,241,234,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; }
  .display { font-family: 'Sora', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px; }
  h1 { font-size: 22px; margin-bottom: 24px; }
  .banner {
    display: none; border: 1px solid var(--error); color: var(--error);
    border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-bottom: 20px;
  }
  .banner.is-visible { display: block; }
  form { display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; }
  .field input, .field select, .field textarea {
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 11px 14px;
    border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg); color: var(--ink);
  }
  #specs-fields { display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 4px; }
  .empty-note { font-size: 13px; color: var(--gray-mid); }
  .btn-primary {
    background: var(--ink); color: var(--bg); border: none; border-radius: 999px;
    padding: 13px 26px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .btn-primary:hover { background: var(--gold-deep); }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="display">{{ "Edit product" if product else "Add product" }}</h1>

  <div class="banner {% if errors.get('specs') %}is-visible{% endif %}">
    {{ errors.get("specs", "") }}
  </div>

  <form action="{{ '/admin/products/' ~ product.id ~ '/edit' if product else '/admin/products/new' }}" method="post">
    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category" required
              hx-get="/admin/products/specs-fields"
              hx-target="#specs-fields"
              hx-trigger="change"
              hx-include="this">
        <option value="">Select a category...</option>
        <option value="panel" {% if form_values.get("category") == "panel" %}selected{% endif %}>Panel</option>
        <option value="inverter" {% if form_values.get("category") == "inverter" %}selected{% endif %}>Inverter</option>
        <option value="battery" {% if form_values.get("category") == "battery" %}selected{% endif %}>Battery</option>
        <option value="solar_generator" {% if form_values.get("category") == "solar_generator" %}selected{% endif %}>Solar generator</option>
        <option value="solar_street_light" {% if form_values.get("category") == "solar_street_light" %}selected{% endif %}>Solar street light</option>
        <option value="fan" {% if form_values.get("category") == "fan" %}selected{% endif %}>Fan</option>
        <option value="accessory" {% if form_values.get("category") == "accessory" %}selected{% endif %}>Accessory</option>
      </select>
    </div>

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ form_values.get('name', '') }}" required>
    </div>

    <div class="field">
      <label for="price">Price (₦)</label>
      <input type="number" step="any" id="price" name="price" value="{{ form_values.get('price', '') }}" required>
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="3">{{ form_values.get('description', '') }}</textarea>
    </div>

    <div class="field">
      <label for="image_url">Image path</label>
      <input type="text" id="image_url" name="image_url" placeholder="/static/products/panel-450w.jpg"
             value="{{ form_values.get('image_url', '') }}">
    </div>

    <div id="specs-fields">
      {% if fields %}
        {% include "admin/_specs_fields.html" %}
      {% else %}
        <p class="empty-note">Select a category to see its spec fields.</p>
      {% endif %}
    </div>

    <button type="submit" class="btn-primary">{{ "Save changes" if product else "Add product" }}</button>

    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  </form>
</div>
</body>
</html>
