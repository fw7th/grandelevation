<nav class="nav">
  <a href="/catalog" class="nav-brand">
    <div class="logo-spinner">
      <img src="/static/grand_logo.png" alt="Grand Elevation Solar">
      <div class="orbit-dot"></div>
    </div>
  </a>

  <div class="search-bar">
    <input type="text" id="navSearchInput" placeholder="Search panels, inverters, batteries..." value="{{ query or '' }}">
    <button type="button" class="search-submit" id="navSearchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>

  <div class="nav-actions">
    <a href="/build" class="nav-build-link" aria-label="Build a solar system">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <span>Build a system</span>

    {% if username %}
    <a href="/favorites" class="nav-icon-link" aria-label="Favorites">
    {% else %}
    <a href="/favorites" class="nav-icon-link" data-requires-auth aria-label="Favorites">
    {% endif %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>

    <a href="/account" class="nav-icon-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      {{ username }}
    </a>
    {% else %}
    <a href="/signin" class="nav-icon-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      Sign in
    </a>
    {% endif %}

    {% if username %}

    {% else %}
    <a href="/cart" class="nav-icon-link" data-requires-auth>
    {% endif %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.4 12.4a2 2 0 0 0 2 1.6h9.2a2 2 0 0 0 2-1.6L23 6H6"/></svg>
